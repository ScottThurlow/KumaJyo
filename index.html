<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow">
  <title>KumaJyo – Bellevue View</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      /* 👇 change this to your actual file name */
      background-image: url("/images/kumajyo.jpg");
      background-size: cover;         /* fill the screen */
      background-position: center;    /* keep the important stuff centered */
      background-repeat: no-repeat;
      background-attachment: fixed;   /* nice effect when scrolling */
    }

    .overlay {
      height: 100%;
      width: 100%;
      background: rgba(0, 0, 0, 0.25); /* subtle dark overlay so text pops */
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
    }

    .title-box {
      padding: 1.5rem 2.5rem;
      border-radius: 999px;
      backdrop-filter: blur(10px);
      background: rgba(0, 0, 0, 0.35);
    }

    .title-box h1 {
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-size: 1.2rem;
    }

    .title-box p {
      margin-top: 0.3rem;
      font-size: 0.9rem;
      opacity: 0.9;
    }

    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      text-align: center;
      padding: 0.6rem;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.75rem;
    }

    footer a {
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
    }

    footer a:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="title-box">
      <h1>KUMAJYO</h1>
      <p>City views from the bear's den</p>
    </div>
  </div>
  <footer>
    &copy; 2026 KumaJyo.com. All rights reserved.
    <br>
    Licensed under <a href="https://creativecommons.org/licenses/by-nc-nd/4.0/" target="_blank" rel="noopener">CC BY-NC-ND 4.0</a>
  </footer>
</body>
</html>
