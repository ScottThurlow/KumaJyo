<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow">
  <title>Page Not Found – KumaJyo</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background-image: url("/images/kumajyo.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .overlay {
      height: 100%;
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      padding: 1.5rem;
    }

    .title-box {
      padding: 2rem 2.5rem;
      border-radius: 24px;
      backdrop-filter: blur(10px);
      background: rgba(0, 0, 0, 0.35);
      max-width: 26rem;
    }

    .title-box .code {
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-size: 0.85rem;
      opacity: 0.7;
    }

    .title-box h1 {
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 1.4rem;
      margin-top: 0.6rem;
    }

    .title-box p {
      margin-top: 0.8rem;
      font-size: 0.95rem;
      opacity: 0.9;
      line-height: 1.5;
    }

    .title-box a.home-link {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.6rem 1.4rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border: 1px solid rgba(255, 255, 255, 0.3);
      transition: background 0.2s ease;
    }

    .title-box a.home-link:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      text-align: center;
      padding: 0.6rem;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.75rem;
    }

    footer a {
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
    }

    footer a:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="title-box">
      <p class="code">404</p>
      <h1>PAGE NOT FOUND</h1>
      <p>This view doesn't exist. The bear's den only looks out over one page.</p>
      <a class="home-link" href="/">Back to KumaJyo</a>
    </div>
  </div>
  <footer>
    &copy; 2026 KumaJyo.com. All rights reserved.
    <br>
    Licensed under <a href="https://creativecommons.org/licenses/by-nc-nd/4.0/" target="_blank" rel="noopener">CC BY-NC-ND 4.0</a>
  </footer>
</body>
</html>
